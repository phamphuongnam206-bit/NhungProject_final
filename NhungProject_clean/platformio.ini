; One workspace. Every environment has exactly one firmware entrypoint.
[platformio]
default_envs = test_static_route

[env]
platform = ststm32@20.0.0
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_speed = 100
board_upload.maximum_size = 64512
monitor_speed = 115200
; Select the COM port at monitor time (no hardcoded COM13).

[env:test_static_route]
; Smooth route + VL53L0X obstacle avoidance. Add -DSTATIC_ROUTE_NO_RANGE to test path following without sensors.
lib_deps = pololu/VL53L0X@^1.3.1
build_flags =
    -DI2C_TIMEOUT_TICK=5
    -flto
build_src_filter = -<*> +<test_static_route.cpp>

; Same firmware for the HC-05 Bluetooth module on PA9/PA10 (38400 baud).
; tools/stm32.py still maps test_static_route.cpp to the env above (115200).
[env:test_static_route_bt]
extends = env:test_static_route
build_flags =
    ${env:test_static_route.build_flags}
    -DSTATIC_ROUTE_BAUD=38400
monitor_speed = 38400

[env:test_encoder]
build_src_filter = -<*> +<diagnostics/test_encoder_raw.cpp>

[env:test_motor_pi]
build_src_filter = -<*> +<diagnostics/test_motor_pi.cpp>

[env:test_mpu]
build_src_filter = -<*> +<diagnostics/test_mpu.cpp>

[env:test_led]
build_src_filter = -<*> +<diagnostics/test_led.cpp>

[env:test_vl53]
lib_deps = pololu/VL53L0X@^1.3.1
build_src_filter = -<*> +<diagnostics/test_vl53.cpp>

[env:test_vl53_encoder]
lib_deps = pololu/VL53L0X@^1.3.1
build_src_filter = -<*> +<diagnostics/test_vl53_encoder.cpp>

[env:test_distance]
lib_deps = pololu/VL53L0X@^1.3.1
build_src_filter = -<*> +<diagnostics/test_distance.cpp>

; Preserved old competition programs, NOT the 5-node PI route.
[env:hybrid_2laps]
monitor_speed = 38400
lib_deps = pololu/VL53L0X@^1.3.1
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
build_src_filter = -<*> +<competition_legacy/hybrid_2laps.cpp>

[env:xe_full]
monitor_speed = 38400
lib_deps = pololu/VL53L0X@^1.3.1
build_src_filter = -<*> +<competition_legacy/xe_full.cpp> +<competition_legacy/bluetooth.cpp>

; Generic env for ANY new .cpp in src/ (no need to register it here).
; tools/stm32.py (Ctrl+Shift+B) points it at the open file via PLATFORMIO_BUILD_SRC_FILTER.
[env:auto]
; Baud for "Doc Serial" of new files. Change here if your new code uses another baud.
monitor_speed = 115200
lib_deps = pololu/VL53L0X@^1.3.1
build_flags =
    -DI2C_TIMEOUT_TICK=5
build_src_filter = -<*> +<test_static_route.cpp>
